services:
  redis:
    image: redis:7
    container_name: bucktuality-redis
    ports:
      - "6379:6379"

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bucktuality-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Bucktuality@12345"
    ports:
      - "1433:1433"
    volumes:
      - bucktuality-sql-data:/var/opt/mssql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: bucktuality-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bucktuality-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: bucktuality-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  bucktuality-sql-data: