services:
  redis:
    image: redis:7
    container_name: bucktuality-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bucktuality-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Bucktuality@12345"
    ports:
      - "1433:1433"
    volumes:
      - bucktuality-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Bucktuality@12345" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: bucktuality-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bucktuality-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: bucktuality-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  gateway:
    build:
      context: ./backend/dotnet
      dockerfile: Bucktuality.Gateway/Dockerfile
    container_name: bucktuality-gateway
    ports:
      - "5000:5000"
    depends_on:
      - user-service
      - realtime-service
      - session-service
      - moderation-service
      - analytics-service
      - presence-service
      - notification-service

  realtime-service:
    build:
      context: ./backend/dotnet
      dockerfile: Bucktuality.RealtimeService/Dockerfile
    container_name: bucktuality-realtime-service
    ports:
      - "5005:5005"
    depends_on:
      matchmaking-service:
        condition: service_started
      session-service:
        condition: service_started
      presence-service:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: ./backend/dotnet
      dockerfile: Bucktuality.UserService/Dockerfile
    container_name: bucktuality-user-service
    ports:
      - "5010:5010"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

  session-service:
    build:
      context: ./backend/dotnet
      dockerfile: Bucktuality.SessionService/Dockerfile
    container_name: bucktuality-session-service
    ports:
      - "5011:5011"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

  moderation-service:
    build:
      context: ./backend/dotnet
      dockerfile: Bucktuality.ModerationService/Dockerfile
    container_name: bucktuality-moderation-service
    ports:
      - "5012:5012"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

  matchmaking-service:
    build:
      context: ./backend/go/matchmaking-service
      dockerfile: Dockerfile
    container_name: bucktuality-matchmaking-service
    ports:
      - "8081:8081"
    environment:
      REDIS_ADDRESS: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: ./backend/go/analytics-service
      dockerfile: Dockerfile
    container_name: bucktuality-analytics-service
    ports:
      - "8083:8083"
    environment:
      KAFKA_BROKER: kafka:9092
      SQL_CONNECTION_STRING: "sqlserver://sa:Bucktuality%4012345@mssql:1433?database=BucktualityAnalyticsDb&encrypt=disable"
    depends_on:
      kafka:
        condition: service_healthy
      mssql:
        condition: service_healthy
    restart: unless-stopped

  presence-service:
    build:
      context: ./backend/go/presence-service
      dockerfile: Dockerfile
    container_name: bucktuality-presence-service
    ports:
      - "8084:8084"
    environment:
      REDIS_ADDRESS: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend/go/notification-service
      dockerfile: Dockerfile
    container_name: bucktuality-notification-service
    ports:
      - "8085:8085"
    environment:
      KAFKA_BROKER: kafka:9092
      SQL_CONNECTION_STRING: "sqlserver://sa:Bucktuality%4012345@mssql:1433?database=BucktualityNotificationsDb&encrypt=disable"
    depends_on:
      kafka:
        condition: service_healthy
      mssql:
        condition: service_healthy
    restart: unless-stopped   

volumes:
  bucktuality-sql-data: