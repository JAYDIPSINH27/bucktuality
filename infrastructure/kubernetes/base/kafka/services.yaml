apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: bucktuality
  labels:
    app: kafka
spec:
  clusterIP: None

  selector:
    app: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: 9092

    - name: controller
      port: 9093
      targetPort: 9093

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bucktuality
  labels:
    app: kafka
spec:
  type: ClusterIP

  selector:
    app: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: 9092