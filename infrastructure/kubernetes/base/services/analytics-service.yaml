apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: bucktuality
  labels:
    app: analytics-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-service

  template:
    metadata:
      labels:
        app: analytics-service

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: analytics-service
          image: jpsinh27/bucktuality-analytics-service:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8083

          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"

            - name: SQL_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: analytics-service-secret
                  key: sql-connection-string

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: bucktuality
  labels:
    app: analytics-service

spec:
  type: ClusterIP

  selector:
    app: analytics-service

  ports:
    - name: http
      port: 8083
      targetPort: 8083