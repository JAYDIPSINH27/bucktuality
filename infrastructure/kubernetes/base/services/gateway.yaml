apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: bucktuality
  labels:
    app: gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: gateway
          image: jpsinh27/bucktuality-gateway:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5000"

            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: bucktuality
  labels:
    app: gateway

spec:
  type: NodePort

  selector:
    app: gateway

  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 31000