apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaking-service
  namespace: bucktuality
  labels:
    app: matchmaking-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: matchmaking-service

  template:
    metadata:
      labels:
        app: matchmaking-service

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: matchmaking-service
          image: jpsinh27/bucktuality-matchmaking-service:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8081

          env:
            - name: REDIS_ADDRESS
              value: "redis:6379"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: matchmaking-service
  namespace: bucktuality
  labels:
    app: matchmaking-service

spec:
  type: ClusterIP

  selector:
    app: matchmaking-service

  ports:
    - name: http
      port: 8081
      targetPort: 8081