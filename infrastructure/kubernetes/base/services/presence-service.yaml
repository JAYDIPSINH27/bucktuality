apiVersion: apps/v1
kind: Deployment
metadata:
  name: presence-service
  namespace: bucktuality
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presence-service
  template:
    metadata:
      labels:
        app: presence-service
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: presence-service
          image: jpsinh27/bucktuality-presence-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: REDIS_ADDRESS
              value: redis:6379
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: presence-service
  namespace: bucktuality
spec:
  selector:
    app: presence-service
  ports:
    - port: 8084
      targetPort: 8084