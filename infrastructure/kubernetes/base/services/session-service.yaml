apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  namespace: bucktuality
  labels:
    app: session-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: session-service

  template:
    metadata:
      labels:
        app: session-service

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: session-service
          image: jpsinh27/bucktuality-session-service:v1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5011

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5011"

            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: session-service-secret
                  key: connection-string

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 5011
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /health
              port: 5011
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5011
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: session-service
  namespace: bucktuality
  labels:
    app: session-service

spec:
  type: ClusterIP

  selector:
    app: session-service

  ports:
    - name: http
      port: 5011
      targetPort: 5011