apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: bucktuality
spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: user-service
          image: jpsinh27/bucktuality-user-service:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5010

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5010"

            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            # ASP.NET converts double underscores into nested
            # configuration keys:
            # ConnectionStrings__DefaultConnection
            # becomes ConnectionStrings:DefaultConnection.
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: connection-string

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5010
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 5010
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: bucktuality
spec:
  type: ClusterIP

  selector:
    app: user-service

  ports:
    - name: http
      port: 5010
      targetPort: 5010