apiVersion: v1
kind: PersistentVolume
metadata:
  name: mssql-pv
  labels:
    app: mssql
spec:
  capacity:
    storage: 20Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: local-storage

  local:
    path: /var/lib/bucktuality/mssql

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker1