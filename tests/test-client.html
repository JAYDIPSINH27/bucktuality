<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bucktuality Full Test Client</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 30px; }
        input, select, button { margin: 5px; padding: 8px; }
        video { width: 360px; height: 260px; background: #111; margin: 10px; }
        #logs { background: #111; color: #00ff00; padding: 15px; height: 300px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

<h1>Bucktuality Full Test Client</h1>

<div>
    <label>Display Name:</label>
    <input id="displayName" placeholder="Jay">
</div>

<div>
    <label>Vibe:</label>
    <input id="vibe" value="banter">
</div>

<div>
    <label>User ID:</label>
    <input id="userId" readonly style="width:500px;">
</div>

<div>
    <label>Connection ID:</label>
    <input id="connectionId" readonly style="width:500px;">
</div>

<div>
    <label>Partner User ID:</label>
    <input id="partnerUserId" readonly style="width:500px;">
</div>

<div>
    <label>Partner Connection ID:</label>
    <input id="partnerConnectionId" readonly style="width:500px;">
</div>

<button onclick="createAnonymousUser()">Create Anonymous User</button>
<button onclick="connect()">Connect</button>
<button onclick="startCamera()">Start Camera</button>
<button onclick="toggleMic()">Toggle Mic</button>
<button onclick="toggleCamera()">Toggle Camera</button>
<button onclick="startMatching()">Start Matching</button>
<button onclick="nextStranger()">Next Stranger</button>
<button onclick="leaveRoom()">Leave Room</button>
<button onclick="startScreenShare()">Start Screen Share</button>
<button onclick="stopScreenShare()">Stop Screen Share</button>
<button onclick="restartIce()">Restart ICE</button>
<hr>

<div>
    <label>Room ID:</label>
    <input id="roomId" readonly style="width:500px;">
</div>

<div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
</div>

<div>
    <input
    id="message"
    placeholder="Type message"
    style="width:350px;"
    oninput="handleTyping()"
>
    <button onclick="sendMessage()">Send</button>
</div>
<div id="typingStatus" style="margin: 8px; color: #666;"></div>

<hr>

<div>
    <label>Report Reason:</label>
    <select id="reportReason">
        <option value="spam">Spam</option>
        <option value="harassment">Harassment</option>
        <option value="inappropriate">Inappropriate Content</option>
        <option value="abusive-language">Abusive Language</option>
        <option value="other">Other</option>
    </select>
    <button onclick="reportUser()">Report Partner</button>
</div>

<hr>

<button onclick="getPresenceSummary()">Get Presence Summary</button>
<button onclick="getAnalyticsSummary()">Get Analytics Summary</button>

<h2>Logs</h2>
<pre id="logs"></pre>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>

<script>
    const USER_SERVICE = "http://localhost:5010";
    const REALTIME_SERVICE = "http://localhost:5005";
    const MODERATION_SERVICE = "http://localhost:5012";
    const PRESENCE_SERVICE = "http://localhost:8084";
    const ANALYTICS_SERVICE = "http://localhost:8083";
    const API = "http://localhost:5000";

    let connection = null;
    let localStream = null;
    let peerConnection = null;
    let pendingIceCandidates = [];
    let micOn = true;
    let cameraOn = true;
    let screenStream = null;
    let originalVideoTrack = null;
    let typingTimer = null;
    let isTyping = false;
    let partnerTypingClearTimer = null;

    function log(message) {
        const logs = document.getElementById("logs");
        const time = new Date().toLocaleTimeString();
        logs.textContent += `[${time}] ${JSON.stringify(message, null, 2)}\n\n`;
        logs.scrollTop = logs.scrollHeight;
    }

    function getValue(id) {
        return document.getElementById(id).value.trim();
    }

    function setValue(id, value) {
        document.getElementById(id).value = value || "";
    }

    async function createAnonymousUser() {
        try {
            const displayName = getValue("displayName");
            const vibe = getValue("vibe");

            const response = await fetch(`${USER_SERVICE}/users/anonymous`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ displayName, vibe })
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            const user = await response.json();
            setValue("userId", user.userId);

            log({ event: "AnonymousUserCreated", data: user });
        } catch (err) {
            log({ event: "CreateUserError", error: err.toString() });
        }
    }

    async function connect() {
        if (connection && connection.state === signalR.HubConnectionState.Connected) {
            log("Already connected.");
            return;
        }

        connection = new signalR.HubConnectionBuilder()
            .withUrl(`${REALTIME_SERVICE}/chatHub`)
            .withAutomaticReconnect()
            .build();

        connection.on("Connected", data => {
            setValue("connectionId", data.connectionId);
            log({ event: "Connected", data });
        });

        connection.on("WaitingForMatch", data => {
            log({ event: "WaitingForMatch", data });
        });

        connection.on("MatchFound", async data => {
            log({ event: "MatchFound", data });

            setValue("roomId", data.roomId);
            setValue("partnerUserId", data.partnerUserId);
            setValue("partnerConnectionId", data.partnerConnectionId);

            await resetPeerConnectionOnly();
            await createPeerConnection();

            const myConnectionId = getValue("connectionId");
            const partnerConnectionId = getValue("partnerConnectionId");

            // Prevent WebRTC offer collision.
            // Only one side creates the offer, based on connectionId comparison.
            if (myConnectionId > partnerConnectionId) {
                await createAndSendOffer();
            } else {
                log("Waiting for partner offer.");
            }
        });

        connection.on("PartnerMediaStatusChanged", data => {
            log({
                event: "PartnerMediaStatusChanged",
                data
            });
        });

        connection.on("ReceiveMessage", data => {
            log({ event: "ReceiveMessage", data });
        });

        connection.on("ReceiveOffer", async data => {
            log({ event: "ReceiveOffer" });

            await createPeerConnection();

            const offer = JSON.parse(data.offer);

            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

            await flushPendingIceCandidates();

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            const roomId = getValue("roomId");
            await connection.invoke("SendAnswer", roomId, JSON.stringify(answer));

            log("Answer sent.");
        });

        connection.on("ReceiveAnswer", async data => {
            log({ event: "ReceiveAnswer" });

            if (!peerConnection) {
                log("No peer connection exists for answer.");
                return;
            }

            const answer = JSON.parse(data.answer);

            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));

            await flushPendingIceCandidates();

            log("Remote answer applied.");
        });

        connection.on("ReceiveIceCandidate", async data => {
            const candidate = JSON.parse(data.candidate);

            if (!peerConnection || !peerConnection.remoteDescription) {
                pendingIceCandidates.push(candidate);
                log("ICE candidate queued.");
                return;
            }

            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            log("ICE candidate added.");
        });

        connection.on("PartnerTypingStarted", data => {
            log({
                event: "PartnerTypingStarted",
                data
            });

            clearTimeout(partnerTypingClearTimer);

            document.getElementById("typingStatus").textContent = "Partner is typing...";
        });

        connection.on("PartnerTypingStopped", data => {
            log({
                event: "PartnerTypingStopped",
                data
            });

            clearTimeout(partnerTypingClearTimer);

            partnerTypingClearTimer = setTimeout(() => {
                document.getElementById("typingStatus").textContent = "";
            }, 800);
        });

        connection.on("IceRestartRequested", async data => {
            log({
                event: "IceRestartRequested",
                data
            });

            await createIceRestartOffer();
        });

        connection.on("ReceiveIceRestartOffer", async data => {
            log({
                event: "ReceiveIceRestartOffer"
            });

            const offer = JSON.parse(data.offer);

            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            const roomId = getValue("roomId");

            await connection.invoke(
                "SendIceRestartAnswer",
                roomId,
                JSON.stringify(answer)
            );

            log("ICE restart answer sent.");
        });

        connection.on("ReceiveIceRestartAnswer", async data => {
            log({
                event: "ReceiveIceRestartAnswer"
            });

            const answer = JSON.parse(data.answer);

            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));

            log("ICE restart completed.");
        });

        connection.on("PartnerLeft", data => {
            log({ event: "PartnerLeft", data });
            clearRoomState();
            resetPeerConnectionOnly();
            alert("Your partner left the room.");
        });

        connection.on("LeftRoom", data => {
            log({ event: "LeftRoom", data });
            clearRoomState();
            resetPeerConnectionOnly();
        });

        connection.on("MatchError", data => {
            log({ event: "MatchError", data });
        });

        connection.onclose(error => {
            log({
                event: "Disconnected",
                error: error ? error.toString() : null
            });
            clearRoomState();
            resetPeerConnectionOnly();
        });

        await connection.start();
        log("SignalR connected successfully.");
    }

    async function startCamera() {
        if (localStream) {
            log("Camera already started.");
            return;
        }

        localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        document.getElementById("localVideo").srcObject = localStream;

        log("Camera started.");
    }

    async function createPeerConnection() {
        if (peerConnection) {
            return;
        }

        if (!localStream) {
            await startCamera();
        }

        peerConnection = new RTCPeerConnection({
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" }
            ]
        });

        peerConnection.onicecandidate = async event => {
            if (event.candidate) {
                const roomId = getValue("roomId");

                if (roomId && connection && connection.state === signalR.HubConnectionState.Connected) {
                    await connection.invoke(
                        "SendIceCandidate",
                        roomId,
                        JSON.stringify(event.candidate)
                    );
                }
            }
        };

        peerConnection.ontrack = event => {
            document.getElementById("remoteVideo").srcObject = event.streams[0];
            log("Remote stream received.");
        };

        peerConnection.onconnectionstatechange = () => {
            log({
                event: "PeerConnectionState",
                state: peerConnection.connectionState
            });
        };

        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        log("Peer connection created.");
    }

    async function createAndSendOffer() {
        if (!peerConnection) {
            await createPeerConnection();
        }

        const roomId = getValue("roomId");

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await connection.invoke("SendOffer", roomId, JSON.stringify(offer));

        log("Offer sent.");
    }

    async function startScreenShare() {
    if (!peerConnection) {
        alert("You need to be in a call first.");
        return;
    }

    try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: false
        });

        const screenTrack = screenStream.getVideoTracks()[0];

        const sender = peerConnection
            .getSenders()
            .find(s => s.track && s.track.kind === "video");

        if (!sender) {
            alert("No video sender found.");
            return;
        }

        if (localStream) {
            originalVideoTrack = localStream.getVideoTracks()[0];
        }

        await sender.replaceTrack(screenTrack);

        document.getElementById("localVideo").srcObject = screenStream;

        screenTrack.onended = async () => {
            await stopScreenShare();
        };

        log({
            event: "ScreenShareStarted"
        });

    } catch (err) {
        log({
            event: "ScreenShareError",
            error: err.toString()
        });
    }
}

    async function stopScreenShare() {
        if (!peerConnection || !originalVideoTrack) {
            return;
        }

        const sender = peerConnection
            .getSenders()
            .find(s => s.track && s.track.kind === "video");

        if (sender) {
            await sender.replaceTrack(originalVideoTrack);
        }

        if (screenStream) {
            screenStream.getTracks().forEach(track => track.stop());
            screenStream = null;
        }

        document.getElementById("localVideo").srcObject = localStream;

        log({
            event: "ScreenShareStopped"
        });
    }

    async function flushPendingIceCandidates() {
        if (!peerConnection || !peerConnection.remoteDescription) {
            return;
        }

        for (const candidate of pendingIceCandidates) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        }

        if (pendingIceCandidates.length > 0) {
            log(`Flushed ${pendingIceCandidates.length} ICE candidates.`);
        }

        pendingIceCandidates = [];
    }

    async function startMatching() {
        if (!connection || connection.state !== signalR.HubConnectionState.Connected) {
            alert("Connect first.");
            return;
        }

        const userId = getValue("userId");
        const vibe = getValue("vibe");

        if (!userId) {
            alert("Create anonymous user first.");
            return;
        }

        await resetPeerConnectionOnly();
        clearRoomState(false);

        await connection.invoke("StartMatching", userId, vibe);

        log("StartMatching invoked.");
    }

    async function sendMessage() {
        const roomId = getValue("roomId");
        const userId = getValue("userId");
        const message = getValue("message");

        if (!roomId) {
            alert("No active room.");
            return;
        }

        if (!message) {
            return;
        }

        await connection.invoke("SendMessage", roomId, userId, message);

        setValue("message", "");
        isTyping = false;

        await connection.invoke("TypingStopped", roomId, userId);
    }

    async function leaveRoom() {
        const roomId = getValue("roomId");

        if (!roomId) {
            alert("No active room.");
            return;
        }

        await connection.invoke("LeaveRoom", roomId);

        clearRoomState();
        await resetPeerConnectionOnly();

        log("LeaveRoom invoked.");
    }

    async function reportUser() {
        const roomId = getValue("roomId");
        const reporterUserId = getValue("userId");
        const reportedUserId = getValue("partnerUserId");
        const reason = getValue("reportReason");

        if (!roomId || !reportedUserId) {
            alert("No partner to report.");
            return;
        }

        const response = await fetch(`${MODERATION_SERVICE}/reports`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                roomId,
                reporterUserId,
                reportedUserId,
                reason
            })
        });

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const report = await response.json();

        log({ event: "UserReported", data: report });
        alert("Report submitted.");
    }

async function getPresenceSummary() {
    try {
        const response = await fetch(`${API}/presence/presence/summary`);

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const data = await response.json();

        log({
            event: "PresenceSummary",
            data
        });

    } catch (err) {
        log({
            event: "PresenceSummaryError",
            error: err.toString()
        });
    }
}

async function getAnalyticsSummary() {
    try {
        const response = await fetch(`${API}/analytics/analytics/summary`);

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const data = await response.json();

        log({
            event: "AnalyticsSummary",
            data
        });

    } catch (err) {
        log({
            event: "AnalyticsSummaryError",
            error: err.toString()
        });
    }
}

async function toggleMic() {
    if (!localStream) {
        await startCamera();
    }

    const audioTracks = localStream.getAudioTracks();

    audioTracks.forEach(track => {
        track.enabled = !track.enabled;
        micOn = track.enabled;
    });

    await updateMediaStatus();

    log({
        event: "MicToggled",
        micOn
    });
}

async function toggleCamera() {
    if (!localStream) {
        await startCamera();
    }

    const videoTracks = localStream.getVideoTracks();

    videoTracks.forEach(track => {
        track.enabled = !track.enabled;
        cameraOn = track.enabled;
    });

    await updateMediaStatus();

    log({
        event: "CameraToggled",
        cameraOn
    });
}

async function updateMediaStatus() {
    if (!connection || connection.state !== signalR.HubConnectionState.Connected) {
        return;
    }

    const userId = getValue("userId");
    const roomId = getValue("roomId");

    if (!userId) {
        return;
    }

    await connection.invoke(
        "UpdateMediaStatus",
        userId,
        roomId,
        cameraOn,
        micOn
    );
}

    async function nextStranger() {
        if (!connection || connection.state !== signalR.HubConnectionState.Connected) {
            alert("Connect first.");
            return;
        }

        const userId = getValue("userId");
        const vibe = getValue("vibe");
        const currentRoomId = getValue("roomId");

        if (!userId) {
            alert("Create anonymous user first.");
            return;
        }

        await resetPeerConnectionOnly();
        clearRoomState();

        await connection.invoke(
            "NextStranger",
            userId,
            vibe,
            currentRoomId
        );

        log({
            event: "NextStrangerInvoked",
            previousRoomId: currentRoomId
        });
    }

    async function restartIce() {
    const roomId = getValue("roomId");

    if (!roomId) {
        alert("No active room.");
        return;
    }

    if (!peerConnection) {
        alert("No peer connection.");
        return;
    }

    await connection.invoke("RequestIceRestart", roomId);

    log("ICE restart requested.");
}

async function createIceRestartOffer() {
    if (!peerConnection) {
        await createPeerConnection();
    }

    const roomId = getValue("roomId");

    const offer = await peerConnection.createOffer({
        iceRestart: true
    });

    await peerConnection.setLocalDescription(offer);

    await connection.invoke(
        "SendIceRestartOffer",
        roomId,
        JSON.stringify(offer)
    );

    log("ICE restart offer sent.");
}

    function clearRoomState(clearPartner = true) {
        setValue("roomId", "");

        if (clearPartner) {
            setValue("partnerUserId", "");
            setValue("partnerConnectionId", "");
        }

        setValue("message", "");
        document.getElementById("remoteVideo").srcObject = null;
    }

    async function resetPeerConnectionOnly() {
        pendingIceCandidates = [];

        if (screenStream) {
            screenStream.getTracks().forEach(track => track.stop());
            screenStream = null;
        }

        originalVideoTrack = null;

        if (peerConnection) {
            peerConnection.onicecandidate = null;
            peerConnection.ontrack = null;
            peerConnection.onconnectionstatechange = null;

            peerConnection.getSenders().forEach(sender => {
                try {
                    peerConnection.removeTrack(sender);
                } catch {}
            });

            peerConnection.close();
            peerConnection = null;
        }

        document.getElementById("remoteVideo").srcObject = null;

        log("Peer connection reset.");
    }

    async function handleTyping() {
            const roomId = getValue("roomId");
            const userId = getValue("userId");

            if (!roomId || !connection || connection.state !== signalR.HubConnectionState.Connected) {
                return;
            }

            if (!isTyping) {
                isTyping = true;

                await connection.invoke("TypingStarted", roomId, userId);
            }

            clearTimeout(typingTimer);

            typingTimer = setTimeout(async () => {
    isTyping = false;

    await connection.invoke("TypingStopped", roomId, userId);
}, 2500);
        }
</script>

</body>
</html>
