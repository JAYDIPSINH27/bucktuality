<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bucktuality Video Test</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
        }

        input, select, button {
            margin: 5px;
            padding: 8px;
        }

        video {
            width: 360px;
            height: 260px;
            background: #111;
            margin: 10px;
        }

        #logs {
            background: #111;
            color: #00ff00;
            padding: 15px;
            height: 280px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h1>Bucktuality Video Test Client</h1>

<div>
    <label>Display Name:</label>
    <input id="displayName" placeholder="Jay">
</div>

<div>
    <label>Vibe:</label>
    <input id="vibe" value="banter">
</div>

<div>
    <label>User ID:</label>
    <input id="userId" readonly style="width:450px;">
</div>

<div>
    <label>Partner User ID:</label>
    <input id="partnerUserId" readonly style="width:450px;">
</div>

<button onclick="createAnonymousUser()">Create Anonymous User</button>
<button onclick="connect()">Connect</button>
<button onclick="startCamera()">Start Camera</button>
<button onclick="startMatching()">Start Matching</button>

<hr>

<div>
    <label>Room ID:</label>
    <input id="roomId" readonly style="width:450px;">
</div>

<div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
</div>

<div>
    <input id="message" placeholder="Type message">
    <button onclick="sendMessage()">Send</button>
    <button onclick="leaveRoom()">Leave Room</button>
</div>

<hr>

<div>
    <label>Report Reason:</label>
    <select id="reportReason">
        <option value="spam">Spam</option>
        <option value="harassment">Harassment</option>
        <option value="inappropriate">Inappropriate Content</option>
        <option value="abusive-language">Abusive Language</option>
        <option value="other">Other</option>
    </select>

    <button onclick="reportUser()">Report Partner</button>
</div>

<h2>Logs</h2>
<pre id="logs"></pre>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>

<script>
let connection = null;
let peerConnection = null;
let localStream = null;
let isOfferCreator = false;

function log(message) {
    const logs = document.getElementById("logs");
    const time = new Date().toLocaleTimeString();
    logs.textContent += `[${time}] ${JSON.stringify(message, null, 2)}\n\n`;
    logs.scrollTop = logs.scrollHeight;
}

async function createAnonymousUser() {
    const displayName = document.getElementById("displayName").value.trim();
    const vibe = document.getElementById("vibe").value.trim();

    const response = await fetch("http://localhost:5010/users/anonymous", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ displayName, vibe })
    });

    const user = await response.json();

    document.getElementById("userId").value = user.userId;

    log({
        event: "AnonymousUserCreated",
        data: user
    });
}

async function connect() {
    connection = new signalR.HubConnectionBuilder()
        .withUrl("http://localhost:5005/chatHub")
        .withAutomaticReconnect()
        .build();

    connection.on("Connected", data => {
        log({ event: "Connected", data });
    });

    connection.on("WaitingForMatch", data => {
        log({ event: "WaitingForMatch", data });
    });

    connection.on("MatchFound", async data => {
        log({ event: "MatchFound", data });

        document.getElementById("roomId").value = data.roomId;
        document.getElementById("partnerUserId").value = data.partnerUserId || "";

        await createPeerConnection();

        // Only the second matched user creates the offer.
        isOfferCreator = true;
        await createAndSendOffer();
    });

    connection.on("ReceiveMessage", data => {
        log({ event: "ReceiveMessage", data });
    });

    connection.on("ReceiveOffer", async data => {
        log({ event: "ReceiveOffer" });

        await createPeerConnection();

        const offer = JSON.parse(data.offer);

        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

        const answer = await peerConnection.createAnswer();

        await peerConnection.setLocalDescription(answer);

        const roomId = document.getElementById("roomId").value;

        await connection.invoke("SendAnswer", roomId, JSON.stringify(answer));
    });

    connection.on("ReceiveAnswer", async data => {
        log({ event: "ReceiveAnswer" });

        const answer = JSON.parse(data.answer);

        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    });

    connection.on("ReceiveIceCandidate", async data => {
        log({ event: "ReceiveIceCandidate" });

        const candidate = JSON.parse(data.candidate);

        if (peerConnection) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        }
    });

    connection.on("PartnerLeft", data => {
        log({ event: "PartnerLeft", data });
        cleanupCall();
        document.getElementById("roomId").value = "";
        document.getElementById("partnerUserId").value = "";
    });

    connection.on("LeftRoom", data => {
        log({ event: "LeftRoom", data });
        cleanupCall();
        document.getElementById("roomId").value = "";
        document.getElementById("partnerUserId").value = "";
    });

    connection.on("MatchError", data => {
        log({ event: "MatchError", data });
    });

    await connection.start();

    log("SignalR connected successfully.");
}

async function startCamera() {
    localStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
    });

    document.getElementById("localVideo").srcObject = localStream;

    log("Camera started.");
}

async function createPeerConnection() {
    if (peerConnection) {
        return;
    }

    peerConnection = new RTCPeerConnection({
        iceServers: [
            {
                urls: "stun:stun.l.google.com:19302"
            }
        ]
    });

    peerConnection.onicecandidate = async event => {
        if (event.candidate) {
            const roomId = document.getElementById("roomId").value;

            await connection.invoke(
                "SendIceCandidate",
                roomId,
                JSON.stringify(event.candidate)
            );
        }
    };

    peerConnection.ontrack = event => {
        document.getElementById("remoteVideo").srcObject = event.streams[0];

        log("Remote stream received.");
    };

    if (!localStream) {
        await startCamera();
    }

    localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
    });

    log("Peer connection created.");
}

async function createAndSendOffer() {
    const roomId = document.getElementById("roomId").value;

    const offer = await peerConnection.createOffer();

    await peerConnection.setLocalDescription(offer);

    await connection.invoke("SendOffer", roomId, JSON.stringify(offer));

    log("Offer sent.");
}

async function startMatching() {
    const userId = document.getElementById("userId").value.trim();
    const vibe = document.getElementById("vibe").value.trim();

    if (!userId) {
        alert("Create anonymous user first.");
        return;
    }

    await connection.invoke("StartMatching", userId, vibe);

    log("StartMatching invoked.");
}

async function sendMessage() {
    const roomId = document.getElementById("roomId").value.trim();
    const userId = document.getElementById("userId").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!roomId || !message) {
        return;
    }

    await connection.invoke("SendMessage", roomId, userId, message);

    document.getElementById("message").value = "";
}

async function leaveRoom() {
    const roomId = document.getElementById("roomId").value.trim();

    if (!roomId) {
        alert("No active room.");
        return;
    }

    await connection.invoke("LeaveRoom", roomId);
}

async function reportUser() {
    const roomId = document.getElementById("roomId").value.trim();
    const reporterUserId = document.getElementById("userId").value.trim();
    const reportedUserId = document.getElementById("partnerUserId").value.trim();
    const reason = document.getElementById("reportReason").value;

    if (!roomId || !reportedUserId) {
        alert("No partner to report.");
        return;
    }

    const response = await fetch("http://localhost:5012/reports", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            roomId,
            reporterUserId,
            reportedUserId,
            reason
            
        })
    });

    const report = await response.json();

    log({
        event: "UserReported",
        data: report
    });
}

function cleanupCall() {
    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }

    document.getElementById("remoteVideo").srcObject = null;
}
</script>

</body>
</html>
